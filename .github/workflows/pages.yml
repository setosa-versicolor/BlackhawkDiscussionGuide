name: Build & Deploy Discussion Guide

on:
  workflow_dispatch:
  schedule:
    # 7am Central: 12:00 UTC during CDT, 13:00 UTC during CST (see gate job)
    - cron: "0 12 * * 0"
    - cron: "0 13 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  TZ: America/Chicago

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        # Cron is UTC-only: keep whichever of the two schedules is 7am Central today.
        run: |
          offset=$(TZ=America/Chicago date +%z)
          case "${{ github.event.schedule }}" in
            "0 12 * * 0") want=-0500 ;;
            "0 13 * * 0") want=-0600 ;;
            *) want=$offset ;;
          esac
          [ "$offset" = "$want" ] && echo run=true >> "$GITHUB_OUTPUT" || echo run=false >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build site
        run: python scripts/update.py
      - name: Generate hero image
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_hero.py --json site/data/guide.json --out site/data/hero.webp
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

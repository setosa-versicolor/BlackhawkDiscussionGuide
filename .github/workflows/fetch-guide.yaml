# .github/workflows/fetch-guide.yml
name: Fetch Guide (Blackhawk auto)

on:
  schedule:
    # 7am Central: 12:00 UTC during CDT, 13:00 UTC during CST (see gate job)
    - cron: "0 12 * * 0"
    - cron: "0 13 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write   # allow pushing guide.json back to the repo

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        # Cron is UTC-only: keep whichever of the two schedules is 7am Central today.
        run: |
          offset=$(TZ=America/Chicago date +%z)
          case "${{ github.event.schedule }}" in
            "0 12 * * 0") want=-0500 ;;
            "0 13 * * 0") want=-0600 ;;
            *) want=$offset ;;
          esac
          [ "$offset" = "$want" ] && echo run=true >> "$GITHUB_OUTPUT" || echo run=false >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate data/guide.json
        run: |
          python scripts/update.py --out-json data/guide.json

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/guide.json
          git commit -m "Auto-update guide.json" || echo "No changes"
          git push

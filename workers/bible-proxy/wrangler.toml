name = "bible-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Durable, global cache of resolved passages. A given translation+passage is
# fetched from API.Bible once, ever, then served from here for every reader.
# The Cache API is not used: it needs a custom domain and is a no-op on
# *.workers.dev, so it silently saved nothing.
[[kv_namespaces]]
binding = "VERSES"
id = "f52440f361ab4d24949cc833d30953eb"

# The API.Bible key is NOT stored here. Set it as an encrypted secret:
#   npx wrangler secret put API_BIBLE_KEY
